<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Tracker Pro v20</title>
    <style>
        :root { --primary: #00d2ff; --success: #2ecc71; --bg: #000; --card: #151515; --accent: #ffd700; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        
        .header { width: 100%; max-width: 350px; display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .settings-icon { font-size: 24px; cursor: pointer; padding: 5px; }
        
        .dashboard-card { background: var(--card); border: 1px solid #333; border-radius: 20px; padding: 15px; width: 100%; max-width: 320px; margin-bottom: 15px; }
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; }
        .stat-value { font-family: monospace; font-size: 1.1rem; font-weight: bold; }
        
        #timer { font-size: 3.5rem; color: var(--primary); margin: 20px 0; font-weight: bold; }
        
        .btn { padding: 15px 30px; font-size: 1.2rem; border: none; border-radius: 50px; cursor: pointer; color: #fff; font-weight: bold; width: 80%; max-width: 250px; transition: 0.2s; }
        #mainBtn { background: var(--success); }
        .stop { background: #ff4b2b !important; }
        
        .view-btn { background: none; border: 1px solid #444; color: #888; padding: 8px 20px; border-radius: 20px; cursor: pointer; margin-top: 10px; }
        
        #logContainer { width: 100%; max-width: 350px; display: none; overflow-y: auto; flex-grow: 1; margin-top: 15px; padding-bottom: 20px; }
        .log-item { background: #111; border: 1px solid #222; padding: 12px; border-radius: 15px; margin-bottom: 10px; text-align: right; }
        .log-header { display: flex; justify-content: space-between; color: var(--accent); font-size: 0.8rem; border-bottom: 1px solid #222; padding-bottom: 5px; margin-bottom: 8px; }
        .log-details { display: flex; justify-content: space-between; }
        .detail-box { flex: 1; text-align: center; background: #1a1a1a; padding: 5px; border-radius: 8px; margin: 0 2px; }
        .detail-label { color: #666; font-size: 0.6rem; display: block; }
        .detail-val { font-size: 0.75rem; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 25px; border-radius: 20px; width: 85%; max-width: 300px; border: 1px solid #333; }
        .modal-content input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; text-align: center; font-size: 1.2rem; }
        
        .settings-item { border-bottom: 1px solid #333; padding: 15px 0; cursor: pointer; color: #ccc; text-align: right; }
        
        /* شاشة الأرشيف الكاملة */
        #archiveScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; flex-direction: column; align-items: center; padding: 20px; }
    </style>
</head>
<body onload="initApp()">

    <div class="header"><span class="settings-icon" onclick="openModal('settingsModal')">⚙️</span></div>

    <div class="dashboard-card">
        <div class="stat-row"><span>اليوم:</span><span id="dailyDisplay" class="stat-value">00:00:00</span></div>
        <div class="stat-row"><span>الشهر الحالي:</span><span id="monthlyDisplay" class="stat-value" style="color:var(--accent);">0س 0د</span></div>
    </div>

    <div id="timer">00:00:00</div>
    <button id="mainBtn" class="btn" onclick="askPIN()">ابدأ العمل</button>
    <button class="view-btn" id="toggleLogBtn" onclick="toggleLog()">عرض السجل ⬇️</button>

    <div id="logContainer"></div>

    <div id="pinModal" class="modal">
        <div class="modal-content">
            <h3>أدخل الرمز</h3>
            <input type="password" id="pinInput" placeholder="****" inputmode="numeric" oninput="handlePIN(this.value)">
            <button class="view-btn" onclick="closeModal('pinModal')">إلغاء</button>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0">الإعدادات</h3>
            <div class="settings-item" onclick="openArchive()">الأرشيف العام 📂</div>
            <div class="settings-item" onclick="changePIN()">تغيير الرمز</div>
            <div class="settings-item" onclick="exportData()" style="color:var(--success)">تصدير Excel</div>
            <button class="btn" style="width:100%; margin-top:20px; font-size:1rem; padding:10px;" onclick="closeModal('settingsModal')">إغلاق</button>
        </div>
    </div>

    <div id="archiveScreen">
        <h2 style="color:var(--accent)">الأرشيف العام</h2>
        <div id="archiveList" style="width:100%; max-width:350px;"></div>
        <div id="archiveDetails" style="display:none; width:100%; max-width:350px; overflow-y:auto; flex-grow:1;"></div>
        <button class="btn" style="background:#333; margin-top:auto;" onclick="closeArchive()">رجوع</button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2MiD6KRa_w35y9HINPkyeU-LONvCoxgFFqGeEbkRYsJuuMTOhg6SNYcLu6mCjO18P/exec";
        const SHIFT_LIMIT = 8 * 3600;
        let seconds = 0, timerInterval = null;

        // --- وظائف المودال الأساسية ---
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function getSavedPIN() { return localStorage.getItem('userPIN') || "0000"; }

        // --- التعامل مع الزرار الرئيسي ---
        function askPIN() {
            document.getElementById('pinInput').value = "";
            openModal('pinModal');
            setTimeout(() => document.getElementById('pinInput').focus(), 150);
        }

        function handlePIN(val) {
            if (val.length === 4) {
                if (val === getSavedPIN()) {
                    closeModal('pinModal');
                    processAction();
                } else {
                    alert("خطأ!");
                    document.getElementById('pinInput').value = "";
                }
            }
        }

        function processAction() {
            if (!timerInterval) {
                // حضور
                localStorage.setItem('workStartTime', new Date().toISOString());
                runTimer();
            } else {
                // انصراف
                const finalSec = seconds;
                const start = new Date(localStorage.getItem('workStartTime'));
                saveSession(start, finalSec);
                syncSheet(finalSec);
                
                clearInterval(timerInterval);
                timerInterval = null;
                localStorage.removeItem('workStartTime');
                seconds = 0;
                document.getElementById('timer').innerText = "00:00:00";
                updateUI(false);
                updateTotals();
                if(document.getElementById('logContainer').style.display === 'block') renderLog();
            }
        }

        // --- العداد ---
        function runTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const ts = fmt(seconds);
                document.getElementById('timer').innerText = ts;
                document.getElementById('dailyDisplay').innerText = ts;
            }, 1000);
            updateUI(true);
        }

        // --- إدارة البيانات (26 لـ 25) ---
        function getPeriod(dateObj) {
            const d = new Date(dateObj);
            let m = d.getMonth(), y = d.getFullYear();
            if (d.getDate() >= 26) m++;
            if (m > 11) { m = 0; y++; }
            const pDate = new Date(y, m, 1);
            return {
                key: `${y}-${m+1}`,
                label: pDate.toLocaleDateString('ar-EG', {month:'long', year:'numeric'})
            };
        }

        function saveSession(start, sec) {
            const dStr = `${start.getFullYear()}-${start.getMonth()+1}-${start.getDate()}`;
            let logs = JSON.parse(localStorage.getItem('workLogs') || "{}");
            logs[dStr] = (logs[dStr] || 0) + sec;
            localStorage.setItem('workLogs', JSON.stringify(logs));
        }

        function updateTotals() {
            let logs = JSON.parse(localStorage.getItem('workLogs') || "{}"), total = 0;
            const currentP = getPeriod(new Date()).key;
            for (let d in logs) {
                if (getPeriod(new Date(d)).key === currentP) total += logs[d];
            }
            document.getElementById('monthlyDisplay').innerText = `${Math.floor(total/3600)}س ${Math.floor((total%3600)/60)}د`;
        }

        // --- عرض السجل والأرشيف ---
        function renderLog() {
            const container = document.getElementById('logContainer');
            container.innerHTML = "";
            let logs = JSON.parse(localStorage.getItem('workLogs') || "{}");
            const currentP = getPeriod(new Date()).key;
            
            Object.keys(logs).sort().reverse().forEach(d => {
                if (getPeriod(new Date(d)).key === currentP) {
                    container.innerHTML += createItem(d, logs[d]);
                }
            });
        }

        function createItem(date, s) {
            const d = new Date(date);
            const dayName = d.toLocaleDateString('ar-EG', {weekday:'long'});
            const basic = s > SHIFT_LIMIT ? SHIFT_LIMIT : s;
            const ot = s > SHIFT_LIMIT ? s - SHIFT_LIMIT : 0;
            const h = (sec) => `${Math.floor(sec/3600)}س ${Math.floor((sec%3600)/60)}د`;
            return `<div class="log-item" style="border-right: 4px solid ${ot>0?'#2ecc71':'#333'}">
                <div class="log-header"><span>${dayName}</span><span>${date}</span></div>
                <div class="log-details">
                    <div class="detail-box"><span class="detail-label">أساسي</span><b class="detail-val">${h(basic)}</b></div>
                    <div class="detail-box"><span class="detail-label" style="color:#2ecc71">إضافي</span><b class="detail-val">${h(ot)}</b></div>
                    <div class="detail-box"><span class="detail-label">إجمالي</span><b class="detail-val">${h(s)}</b></div>
                </div>
            </div>`;
        }

        function openArchive() {
            closeModal('settingsModal');
            const scr = document.getElementById('archiveScreen');
            scr.style.display = 'flex';
            const list = document.getElementById('archiveList');
            list.innerHTML = "";
            let logs = JSON.parse(localStorage.getItem('workLogs') || "{}");
            let periods = {};
            Object.keys(logs).forEach(d => {
                const p = getPeriod(new Date(d));
                periods[p.key] = p.label;
            });
            Object.keys(periods).sort().reverse().forEach(k => {
                list.innerHTML += `<div class="settings-item" style="text-align:center; background:#111; border-radius:15px; margin-bottom:10px" onclick="showArchiveDetail('${k}', '${periods[k]}')">${periods[k]}</div>`;
            });
        }

        function showArchiveDetail(key, label) {
            document.getElementById('archiveList').style.display = 'none';
            const det = document.getElementById('archiveDetails');
            det.style.display = 'block';
            det.innerHTML = `<h3 style="color:var(--primary)">${label}</h3>`;
            let logs = JSON.parse(localStorage.getItem('workLogs') || "{}");
            Object.keys(logs).sort().reverse().forEach(d => {
                if (getPeriod(new Date(d)).key === key) det.innerHTML += createItem(d, logs[d]);
            });
            det.innerHTML += `<button class="view-btn" style="width:100%" onclick="document.getElementById('archiveDetails').style.display='none'; document.getElementById('archiveList').style.display='block';">رجوع</button>`;
        }

        function closeArchive() { document.getElementById('archiveScreen').style.display = 'none'; }

        // --- المساعدات ---
        function initApp() {
            updateTotals();
            const s = localStorage.getItem('workStartTime');
            if (s) {
                seconds = Math.floor((new Date() - new Date(s)) / 1000);
                runTimer();
            }
        }
        function fmt(s) { return `${Math.floor(s/3600).toString().padStart(2,'0')}:${Math.floor((s%3600)/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }
        function updateUI(run) {
            const b = document.getElementById('mainBtn');
            b.innerText = run ? "إنهاء العمل" : "ابدأ العمل";
            b.className = run ? "btn stop" : "btn";
        }
        function toggleLog() {
            const c = document.getElementById('logContainer');
            const b = document.getElementById('toggleLogBtn');
            const isOff = c.style.display === 'none' || c.style.display === '';
            c.style.display = isOff ? 'block' : 'none';
            b.innerText = isOff ? 'إخفاء السجل ⬆️' : 'عرض السجل ⬇️';
            if(isOff) renderLog();
        }
        function syncSheet(sec) {
            if (!SCRIPT_URL || SCRIPT_URL.includes("رابط")) return;
            fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', body: JSON.stringify({date: new Date().toLocaleDateString('ar-EG'), hours: (sec/3600).toFixed(2)}) });
        }
        function changePIN() { let p = prompt("الرمز الجديد:"); if(p && p.length===4) localStorage.setItem('userPIN', p); }
        function exportData() {
            let logs = JSON.parse(localStorage.getItem('workLogs') || "{}");
            let csv = "Date,Hours\n";
            for(let d in logs) csv += `${d},${(logs[d]/3600).toFixed(2)}\n`;
            const blob = new Blob([csv], {type:'text/csv'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href=url; a.download='WorkLog.csv'; a.click();
        }
    </script>
</body>
</html>
