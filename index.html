<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Tracker - Ultimate V10</title>
    <style>
        :root { --primary: #00d2ff; --success: #2ecc71; --bg: #000; --card: #151515; --accent: #ffd700; }
        
        /* تنسيق الصفحة الأساسي */
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0; 
            height: 100vh; 
            overflow: hidden; /* منع سكرول الصفحة كلها */
            box-sizing: border-box;
        }
        
        /* الهيدر والترس */
        .header { width: 100%; max-width: 350px; display: flex; justify-content: flex-end; padding-bottom: 10px; flex-shrink: 0; }
        .settings-icon { font-size: 1.5rem; cursor: pointer; color: #666; transition: 0.3s; }

        /* المربع الذهبي */
        .dashboard-card { background: var(--card); border: 1px solid #333; border-radius: 20px; padding: 15px; width: 100%; max-width: 320px; margin-bottom: 15px; flex-shrink: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 5px; border-bottom: 1px solid #222; }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { font-size: 0.85rem; color: #888; }
        .stat-value { font-family: monospace; font-size: 1.1rem; font-weight: bold; }

        /* العداد الكبير والزرار */
        #timer { font-size: 3.8rem; color: var(--primary); margin: 15px 0; font-weight: bold; flex-shrink: 0; }
        .btn { padding: 15px 30px; font-size: 1.2rem; border: none; border-radius: 50px; cursor: pointer; color: #fff; font-weight: bold; width: 80%; max-width: 250px; margin-bottom: 10px; flex-shrink: 0; transition: 0.3s; }
        #mainBtn { background: var(--success); }
        .stop { background: #ff4b2b !important; }
        
        /* زر السجل ومنطقة السكرول */
        .view-btn { background: none; border: 1px solid #444; color: #888; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; margin-bottom: 10px; flex-shrink: 0; }
        
        #logContainer { 
            width: 100%; 
            max-width: 350px; 
            display: none; 
            margin-top: 5px; 
            overflow-y: auto; 
            flex-grow: 1; /* ياخد كل المساحة المتبقية */
            padding-left: 5px;
        }

        /* تجميل شكل السكرول بار */
        #logContainer::-webkit-scrollbar { width: 4px; }
        #logContainer::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* كروت السجل */
        .log-item { background: #111; border: 1px solid #222; padding: 12px; border-radius: 15px; margin-bottom: 10px; text-align: right; position: relative; }
        .has-ot { border-right: 4px solid var(--success); background: #121a12; }
        .log-header { display: flex; justify-content: space-between; color: var(--accent); font-size: 0.85rem; margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .log-details { display: flex; justify-content: space-between; gap: 4px; }
        .detail-box { flex: 1; text-align: center; background: #1a1a1a; padding: 5px; border-radius: 8px; }
        .detail-label { color: #666; display: block; font-size: 0.6rem; margin-bottom: 2px; }
        .detail-val { font-size: 0.75rem; font-weight: bold; }
        .edit-icon { position: absolute; left: 8px; bottom: 8px; cursor: pointer; font-size: 0.9rem; opacity: 0.5; }

        /* المودال (النوافذ المنبثقة) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 25px; border-radius: 20px; width: 85%; max-width: 300px; border: 1px solid #333; }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; text-align: center; box-sizing: border-box; font-size: 1.1rem; }
        .settings-item { border-bottom: 1px solid #333; padding: 15px 0; cursor: pointer; color: #ccc; text-align: right; }
    </style>
</head>
<body onload="checkMemory()">

    <div class="header">
        <span class="settings-icon" onclick="openModal('settingsModal')">⚙️</span>
    </div>

    <div class="dashboard-card">
        <div class="stat-row"><span class="stat-label">ساعات اليوم:</span><span id="dailyDisplay" class="stat-value">00:00:00</span></div>
        <div class="stat-row"><span class="stat-label">الإضافي (OT):</span><span id="otDisplay" class="stat-value">00:00:00</span></div>
        <div class="stat-row"><span class="stat-label">إجمالي الشهر:</span><span id="monthlyDisplay" class="stat-value" style="color: var(--accent);">0س 0د</span></div>
    </div>

    <button class="view-btn" onclick="toggleLog()">عرض السجل بالتفصيل ⬇️</button>
    
    <div id="logContainer"></div>

    <div id="timer">00:00:00</div>
    <button id="mainBtn" class="btn" onclick="askPIN()">ابدأ العمل</button>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>الإعدادات</h3>
            <div class="settings-item" onclick="changePIN()">تغيير رمز الدخول (PIN)</div>
            <div class="settings-item" onclick="setEmail()">تسجيل إيميل التقارير</div>
            <div class="settings-item" onclick="exportToSheet()" style="color:var(--success)">تصدير السجل لـ Excel 📥</div>
            <button class="view-btn" style="margin-top:20px" onclick="closeModal('settingsModal')">إغلاق</button>
        </div>
    </div>

    <div id="pinModal" class="modal">
        <div class="modal-content">
            <h3>أدخل رمز الدخول</h3>
            <input type="password" id="pinInput" placeholder="****" inputmode="numeric" oninput="checkPINAuto(this.value)">
            <button class="view-btn" style="margin-top:10px" onclick="closeModal('pinModal')">إلغاء</button>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>تعديل يدوي</h3>
            <p id="editDateLabel" style="font-size:0.8rem; color:var(--accent)"></p>
            <input type="time" id="timeIn"><input type="time" id="timeOut">
            <button class="btn" style="width:100%; margin-top:20px" onclick="confirmEdit()">حفظ الساعات</button>
            <button class="view-btn" style="margin-top:10px" onclick="closeModal('editModal')">إلغاء</button>
        </div>
    </div>

    <script>
        let seconds = 0, timerInterval = null, currentEditDate = '';
        const SHIFT_LIMIT = 8 * 3600;

        function checkMemory() {
            updateMonthlyTotal();
            if (localStorage.getItem('workStartTime')) {
                seconds = Math.floor((new Date() - new Date(localStorage.getItem('workStartTime'))) / 1000);
                startUI();
            }
        }

        function getPIN() { return localStorage.getItem('userPIN') || "1234"; }
        function askPIN() { document.getElementById('pinModal').style.display='flex'; document.getElementById('pinInput').value=''; document.getElementById('pinInput').focus(); }
        
        function checkPINAuto(val) {
            if (val.length === 4) {
                if (val === getPIN()) { closeModal('pinModal'); toggleTimer(); }
                else { alert("الرمز خطأ!"); document.getElementById('pinInput').value=''; }
            }
        }

        function changePIN() {
            let p = prompt("أدخل الرمز الجديد (4 أرقام):");
            if(p && p.length === 4) { localStorage.setItem('userPIN', p); alert("تم التغيير!"); }
        }

        function setEmail() {
            let e = prompt("أدخل الإيميل:", localStorage.getItem('userEmail') || "");
            if(e) { localStorage.setItem('userEmail', e); alert("تم الحفظ!"); }
        }

        function toggleTimer() {
            if (!timerInterval) {
                localStorage.setItem('workStartTime', new Date());
                startUI();
            } else {
                const totalSec = seconds;
                saveWorkSession();
                sendEmailReport(totalSec);
                clearInterval(timerInterval);
                timerInterval = null;
                localStorage.removeItem('workStartTime');
                seconds = 0;
                document.getElementById('timer').innerText = "00:00:00";
                updateButtonUI(false);
                updateMonthlyTotal();
                if(document.getElementById('logContainer').style.display === 'block') renderLog();
            }
        }

        function sendEmailReport(sec) {
            const email = localStorage.getItem('userEmail');
            if(!email) return;
            const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
            const body = `تقرير عمل ليوم: ${new Date().toLocaleDateString('ar-EG')}%0D%0Aإجمالي الساعات: ${h}س و ${m}د`;
            window.location.href = `mailto:${email}?subject=تقرير العمل&body=${body}`;
        }

        function exportToSheet() {
            let logs = JSON.parse(localStorage.getItem('workLogs') || "{}");
            let csv = "Date,Total Hours\n";
            for(let d in logs) csv += `${d},${(logs[d]/3600).toFixed(2)}\n`;
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'Work_Log.csv'; a.click();
        }

        function startUI() { if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(updateTimer, 1000); updateButtonUI(true); }
        
        function updateTimer() {
            seconds++;
            const ts = formatTime(seconds);
            document.getElementById('timer').innerText = ts;
            document.getElementById('dailyDisplay').innerText = ts;
            if (seconds > SHIFT_LIMIT) {
                document.getElementById('otDisplay').innerText = formatTime(seconds - SHIFT_LIMIT);
                document.getElementById('otDisplay').style.color = "var(--success)";
            }
        }

        function saveWorkSession() {
            const start = new Date(localStorage.getItem('workStartTime'));
            const dStr = `${start.getFullYear()}-${start.getMonth()+1}-${start.getDate()}`;
            let logs = JSON.parse(localStorage.getItem('workLogs') || "{}");
            logs[dStr] = (logs[dStr] || 0) + seconds;
            localStorage.setItem('workLogs', JSON.stringify(logs));
        }

        function updateMonthlyTotal() {
            let logs = JSON.parse(localStorage.getItem('workLogs') || "{}"), total = 0;
            const now = new Date();
            let sP = now.getDate() >= 26 ? new Date(now.getFullYear(), now.getMonth(), 26) : new Date(now.getFullYear(), now.getMonth()-1, 26);
            let eP = now.getDate() >= 26 ? new Date(now.getFullYear(), now.getMonth()+1, 25) : new Date(now.getFullYear(), now.getMonth(), 25);
            for (let d in logs) { if (new Date(d) >= sP && new Date(d) <= eP) total += logs[d]; }
            document.getElementById('monthlyDisplay').innerText = `${Math.floor(total/3600)}س ${Math.floor((total%3600)/60)}د`;
        }

        function renderLog() {
            let logs = JSON.parse(localStorage.getItem('workLogs') || "{}");
            const container = document.getElementById('logContainer');
            container.innerHTML = "";
            Object.keys(logs).sort().reverse().forEach(date => {
                const s = logs[date], d = new Date(date);
                let basic = s > SHIFT_LIMIT ? SHIFT_LIMIT : s, ot = s > SHIFT_LIMIT ? s - SHIFT_LIMIT : 0;
                container.innerHTML += `
                    <div class="log-item ${ot>0?'has-ot':''}">
                        <div class="log-header"><span>${d.toLocaleDateString('ar-EG',{weekday:'long'})}</span><span>${date}</span></div>
                        <div class="log-details">
                            <div class="detail-box"><span class="detail-label">أساسي</span><b class="detail-val">${Math.floor(basic/3600)}س ${Math.floor((basic%3600)/60)}د</b></div>
                            <div class="detail-box"><span class="detail-label">إضافي</span><b class="detail-val" style="color:${ot>0?'var(--success)':'#666'}">${Math.floor(ot/3600)}س ${Math.floor((ot%3600)/60)}د</b></div>
                            <div class="detail-box"><span class="detail-label">الإجمالي</span><b class="detail-val">${Math.floor(s/3600)}س ${Math.floor((s%3600)/60)}د</b></div>
                        </div>
                        <span class="edit-icon" onclick="openEdit('${date}')">✏️</span>
                    </div>`;
            });
        }

        function openEdit(date) { currentEditDate = date; document.getElementById('editDateLabel').innerText = "يوم: " + date; document.getElementById('editModal').style.display = 'flex'; }
        
        function confirmEdit() {
            let tIn = document.getElementById('timeIn').value, tOut = document.getElementById('timeOut').value;
            if (tIn && tOut) {
                let start = new Date(`2000-01-01T${tIn}`), end = new Date(`2000-01-01T${tOut}`);
                if (end < start) end.setDate(end.getDate() + 1);
                let logs = JSON.parse(localStorage.getItem('workLogs') || "{}");
                logs[currentEditDate] = (end - start) / 1000;
                localStorage.setItem('workLogs', JSON.stringify(logs));
                closeModal('editModal'); renderLog(); updateMonthlyTotal();
            }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        
        function toggleLog() { 
            const c = document.getElementById('logContainer'); 
            c.style.display = c.style.display === 'none' ? 'block' : 'none'; 
            if(c.style.display === 'block') renderLog(); 
        }

        function formatTime(s) { return `${Math.floor(s/3600).toString().padStart(2,'0')}:${Math.floor((s%3600)/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }
        
        function updateButtonUI(run) { 
            const b = document.getElementById('mainBtn'); 
            b.innerText = run ? "إنهاء العمل" : "ابدأ العمل"; 
            run ? b.classList.add('stop') : b.classList.remove('stop'); 
        }
    </script>
</body>
</html>
