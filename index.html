<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Tracker - Step 6</title>
    <style>
        :root { --primary: #00d2ff; --success: #2ecc71; --bg: #000; --card: #151515; --accent: #ffd700; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; text-align: center; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh; }
        
        .dashboard-card { background: var(--card); border: 1px solid #333; border-radius: 20px; padding: 15px; width: 100%; max-width: 320px; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #222; }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { font-size: 0.9rem; color: #888; }
        .stat-value { font-family: monospace; font-size: 1.1rem; font-weight: bold; }
        .overtime-active { color: var(--success); text-shadow: 0 0 10px var(--success); }

        #timer { font-size: 4rem; color: var(--primary); margin: 20px 0; font-weight: bold; }
        .btn { padding: 15px 30px; font-size: 1.2rem; border: none; border-radius: 50px; cursor: pointer; color: #fff; font-weight: bold; width: 80%; max-width: 250px; margin-bottom: 10px; }
        #mainBtn { background: var(--success); }
        .stop { background: #ff4b2b !important; }
        
        /* تصميم السجل المطور */
        #logContainer { width: 100%; max-width: 320px; display: none; margin-top: 10px; }
        .log-item { background: #111; border: 1px solid #222; padding: 15px; border-radius: 15px; margin-bottom: 10px; text-align: right; position: relative; }
        .log-header { display: flex; justify-content: space-between; color: var(--accent); font-size: 0.9rem; margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .log-details { display: flex; justify-content: space-around; font-size: 0.85rem; }
        .detail-box { text-align: center; }
        .detail-label { color: #666; display: block; font-size: 0.7rem; }
        .edit-icon { position: absolute; left: 10px; bottom: 10px; cursor: pointer; opacity: 0.5; font-size: 1rem; }
        .view-btn { background: none; border: 1px solid #444; color: #888; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; margin-bottom: 10px; }
    </style>
</head>
<body onload="checkMemory()">

    <div class="dashboard-card">
        <div class="stat-row">
            <span class="stat-label">ساعات اليوم:</span>
            <span id="dailyDisplay" class="stat-value">00:00:00</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">الإضافي (OT):</span>
            <span id="otDisplay" class="stat-value">00:00:00</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">إجمالي الشهر:</span>
            <span id="monthlyDisplay" class="stat-value" style="color: var(--accent);">0h 0m</span>
        </div>
    </div>

    <button class="view-btn" onclick="toggleLog()">عرض السجل بالتفصيل ⬇️</button>
    <div id="logContainer"></div>

    <div id="timer">00:00:00</div>
    <button id="mainBtn" class="btn" onclick="toggleTimer()">ابدأ العمل</button>

    <script>
        let seconds = 0, timerInterval = null;
        const SHIFT_LIMIT = 8 * 3600;

        function checkMemory() {
            updateMonthlyTotal();
            const savedStartTime = localStorage.getItem('workStartTime');
            if (savedStartTime) {
                const startTime = new Date(savedStartTime);
                seconds = Math.floor((new Date() - startTime) / 1000);
                startUI();
            }
        }

        function toggleTimer() {
            if (!timerInterval) {
                localStorage.setItem('workStartTime', new Date());
                startUI();
            } else {
                saveWorkSession();
                clearInterval(timerInterval);
                timerInterval = null;
                localStorage.removeItem('workStartTime');
                seconds = 0;
                document.getElementById('timer').innerText = "00:00:00";
                updateButtonUI(false);
                updateMonthlyTotal();
                if(document.getElementById('logContainer').style.display === 'block') renderLog();
            }
        }

        function startUI() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            updateButtonUI(true);
        }

        function updateTimer() {
            seconds++;
            const timeStr = formatTime(seconds);
            document.getElementById('timer').innerText = timeStr;
            document.getElementById('dailyDisplay').innerText = timeStr;
            if (seconds > SHIFT_LIMIT) {
                const otSecs = seconds - SHIFT_LIMIT;
                document.getElementById('otDisplay').innerText = formatTime(otSecs);
                document.getElementById('otDisplay').classList.add('overtime-active');
            }
        }

        function saveWorkSession() {
            const startTime = new Date(localStorage.getItem('workStartTime'));
            const logDate = `${startTime.getFullYear()}-${startTime.getMonth()+1}-${startTime.getDate()}`;
            let logs = JSON.parse(localStorage.getItem('workLogs') || "{}");
            logs[logDate] = (logs[logDate] || 0) + seconds;
            localStorage.setItem('workLogs', JSON.stringify(logs));
        }

        function updateMonthlyTotal() {
            let logs = JSON.parse(localStorage.getItem('workLogs') || "{}");
            let totalSeconds = 0;
            const now = new Date();
            let startP = now.getDate() >= 26 ? new Date(now.getFullYear(), now.getMonth(), 26) : new Date(now.getFullYear(), now.getMonth()-1, 26);
            let endP = now.getDate() >= 26 ? new Date(now.getFullYear(), now.getMonth()+1, 25) : new Date(now.getFullYear(), now.getMonth(), 25);

            for (let d in logs) {
                let logD = new Date(d);
                if (logD >= startP && logD <= endP) totalSeconds += logs[d];
            }
            document.getElementById('monthlyDisplay').innerText = `${Math.floor(totalSeconds/3600)}h ${Math.floor((totalSeconds%3600)/60)}m`;
        }

        function toggleLog() {
            const container = document.getElementById('logContainer');
            container.style.display = container.style.display === 'none' ? 'block' : 'none';
            if(container.style.display === 'block') renderLog();
        }

        function renderLog() {
            let logs = JSON.parse(localStorage.getItem('workLogs') || "{}");
            const container = document.getElementById('logContainer');
            container.innerHTML = "";
            
            Object.keys(logs).sort().reverse().forEach(dateStr => {
                const totalSec = logs[dateStr];
                const d = new Date(dateStr);
                const dayName = d.toLocaleDateString('ar-EG', {weekday: 'long'});
                
                let basic = totalSec > SHIFT_LIMIT ? SHIFT_LIMIT : totalSec;
                let ot = totalSec > SHIFT_LIMIT ? totalSec - SHIFT_LIMIT : 0;

                container.innerHTML += `
                    <div class="log-item">
                        <div class="log-header">
                            <span>${dayName}</span>
                            <span>${dateStr}</span>
                        </div>
                        <div class="log-details">
                            <div class="detail-box">
                                <span class="detail-label">أساسي</span>
                                <b>${Math.floor(basic/3600)}س</b>
                            </div>
                            <div class="detail-box" style="color:${ot>0?'#2ecc71':'#666'}">
                                <span class="detail-label">إضافي</span>
                                <b>${Math.floor(ot/3600)}س ${Math.floor((ot%3600)/60)}د</b>
                            </div>
                            <div class="detail-box">
                                <span class="detail-label">الإجمالي</span>
                                <b>${Math.floor(totalSec/3600)}س</b>
                            </div>
                        </div>
                        <span class="edit-icon" onclick="editLog('${dateStr}')">✏️</span>
                    </div>`;
            });
        }

        function editLog(date) {
            let newHours = prompt("أدخل إجمالي عدد الساعات الجديد لهذا اليوم:");
            if (newHours !== null && !isNaN(newHours)) {
                let logs = JSON.parse(localStorage.getItem('workLogs') || "{}");
                logs[date] = parseFloat(newHours) * 3600;
                localStorage.setItem('workLogs', JSON.stringify(logs));
                renderLog();
                updateMonthlyTotal();
            }
        }

        function formatTime(s) {
            return `${Math.floor(s/3600).toString().padStart(2,'0')}:${Math.floor((s%3600)/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
        }

        function updateButtonUI(run) {
            const btn = document.getElementById('mainBtn');
            btn.innerText = run ? "إنهاء العمل" : "ابدأ العمل";
            run ? btn.classList.add('stop') : btn.classList.remove('stop');
        }
    </script>
</body>
</html>
