<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>نظام الحضور الاحترافي - أيمن</title>
    <style>
        :root { --gold: #ffd700; --bg: #0a0a0a; --card: #161616; --text: #ffffff; --danger: #ff4b2b; --success: #28a745; --info: #00bfff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow-x: hidden; }

        #splashScreen { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s; }
        .splash-logo { color: var(--gold); font-size: 2rem; font-weight: bold; margin-bottom: 10px; }

        header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #222; }
        .main-card { background: var(--card); width: 92%; max-width: 380px; border-radius: 25px; padding: 25px; margin-top: 20px; border: 1px solid #222; text-align: center; }
        .timer-display { font-size: 3rem; color: var(--gold); font-family: monospace; margin: 15px 0; font-weight: bold; letter-spacing: 2px; }
        
        /* لوحة الإحصائيات الذكية */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #222; }
        .stat-box { background: #111; padding: 10px; border-radius: 12px; border: 1px solid #222; text-align: center; }
        .stat-box label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 5px; }
        .stat-box span { font-size: 0.95rem; font-weight: bold; color: var(--gold); }

        .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-in { background: var(--success); color: white; }
        .btn-out { background: var(--danger); color: white; }

        .quick-log { width: 92%; max-width: 380px; margin-top: 20px; flex: 1; overflow-y: auto; padding-bottom: 20px; }
        .log-item { background: #111; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; border-right: 4px solid var(--gold); font-size: 0.9rem; user-select: none; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card); border-radius: 20px; padding: 20px; width: 100%; max-width: 350px; border: 1px solid #333; }
        .modal input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; background: #000; color: #fff; border: 1px solid #444; text-align: center; font-size: 1.2rem; }
        
        #toast { position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 12px 30px; border-radius: 50px; font-weight: bold; transition: 0.5s; z-index: 10000; }

        .context-menu { display: none; position: fixed; background: #222; border: 1px solid var(--gold); border-radius: 10px; z-index: 10000; width: 150px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .context-menu-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #333; text-align: center; font-size: 0.9rem; }
        .context-menu-item:last-child { border-bottom: none; color: var(--danger); }

        .edit-grid { display: flex; gap: 10px; margin: 20px 0; }
        .edit-field { flex: 1; background: #000; border: 1px solid #444; border-radius: 10px; padding: 10px; color: #fff; text-align: center; }
        .edit-field label { display: block; font-size: 0.7rem; color: var(--gold); margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="splashScreen">
        <div class="splash-logo">نظام الحضور الذكي</div>
        <div style="color:#555; letter-spacing:2px">PRODUCED BY</div>
        <div style="color:#fff; margin-top:5px">أيمن - Ayman</div>
    </div>

    <div id="toast">تمت العملية بنجاح ✅</div>

    <header>
        <div style="width:30px"></div>
        <h2 style="color:var(--gold)">تسجيل العمل</h2>
        <button style="background:none; border:none; color:var(--gold); font-size:1.5rem" onclick="openMenu()">⚙️</button>
    </header>

    <div class="main-card">
        <div id="timer" class="timer-display">00:00:00</div>
        <button id="btnIn" class="btn btn-in" onclick="askPassword('in')">تسجيل حضور</button>
        <button id="btnOut" class="btn btn-out" onclick="askPassword('out')" style="display:none">انصراف وحفظ</button>
        
        <div class="stats-grid">
            <div class="stat-box">
                <label>أيام العمل</label>
                <span id="statDays">0 يوم</span>
            </div>
            <div class="stat-box">
                <label>صافي الساعات</label>
                <span id="statTotalHrs">0 س</span>
            </div>
            <div class="stat-box" style="grid-column: span 2; border-color: var(--info);">
                <label style="color: var(--info);">🚀 إجمالي الأوفر تايم</label>
                <span id="statOvertime" style="color: var(--info);">0 س و 0 د</span>
            </div>
        </div>
    </div>

    <div class="quick-log" id="quickLog">
        <p style="color:#444; text-align:center">سجلات الأسبوع الحالي</p>
    </div>

    <div id="passModal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--gold); text-align:center">أدخل كلمة السر</h3>
            <input type="password" id="passInput" placeholder="****" inputmode="numeric">
            <button class="btn btn-in" onclick="verifyPassword()">تأكيد</button>
            <button class="btn" style="background:#333; color:#fff" onclick="closeModal('passModal')">إلغاء</button>
        </div>
    </div>

    <div id="editEntryModal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--gold); text-align:center">تعديل سجل العمل</h3>
            <p id="editDateLabel" style="font-size:0.8rem; color:#666; margin-top:5px; text-align:center"></p>
            <div class="edit-grid">
                <div class="edit-field">
                    <label>وقت الحضور</label>
                    <input type="time" id="editInTime" style="color:#fff; background:transparent; border:none; font-size:1.2rem; text-align:center; width:100%; outline:none;">
                </div>
                <div class="edit-field">
                    <label>وقت الانصراف</label>
                    <input type="time" id="editOutTime" style="color:#fff; background:transparent; border:none; font-size:1.2rem; text-align:center; width:100%; outline:none;">
                </div>
            </div>
            <button class="btn btn-in" onclick="saveEditedEntry()">حفظ التعديلات</button>
            <button class="btn" style="background:#333; color:#fff" onclick="closeModal('editEntryModal')">إلغاء</button>
        </div>
    </div>

    <div id="deleteConfirmModal" class="modal">
        <div class="modal-content" style="border-color: var(--danger)">
            <h3 style="color:var(--danger); text-align:center">تأكيد الحذف</h3>
            <p style="margin: 15px 0; color: #bbb; text-align:center">هل أنت متأكد من حذف هذا السجل نهائياً؟</p>
            <button class="btn btn-out" onclick="confirmDeleteEntry()">نعم، احذف</button>
            <button class="btn" style="background:#333; color:#fff" onclick="closeModal('deleteConfirmModal')">تراجع</button>
        </div>
    </div>

    <div id="menuModal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--gold); text-align:center; margin-bottom:15px">لوحة التحكم</h3>
            <button class="btn" style="background:#222; color:var(--gold)" onclick="showArchive()">📁 الأرشيف العام</button>
            <button class="btn" style="background:#222; color:#fff" onclick="changePassPrompt()">🔑 تغيير كلمة السر</button>
            <button class="btn" style="background:var(--success); color:#fff" onclick="syncToGoogle()">☁️ مزامنة يدوية للشيت</button>
            <button class="btn" style="background:#444; color:#fff" onclick="closeModal('menuModal')">إغلاق</button>
        </div>
    </div>

    <div id="archiveModal" class="modal">
        <div class="modal-content" style="max-width: 380px; max-height: 80vh; overflow-y: auto; position: relative;">
            <h3 style="color:var(--gold); text-align:center; margin-bottom:15px; position: sticky; top: 0; background: var(--card); padding: 10px 0;">📁 أرشيف السجلات</h3>
            <div id="monthsContainer"></div>
            <button class="btn" style="background:#444; color:#fff; margin-top:15px; position: sticky; bottom: 0;" onclick="closeModal('archiveModal')">إغلاق</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "
