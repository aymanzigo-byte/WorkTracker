<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>نظام تسجيل الساعات الاحترافي</title>
    <style>
        :root { --gold: #ffd700; --bg: #0a0a0a; --card: #161616; --text: #ffffff; --danger: #ff4b2b; --success: #28a745; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }

        /* شاشة البداية */
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            transition: opacity 0.8s ease;
        }
        .splash-logo { color: var(--gold); font-size: 2.2rem; font-weight: bold; margin-bottom: 20px; letter-spacing: 1px; }
        .produced-by { color: #555; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; }
        .dev-name { color: var(--text); font-size: 1.2rem; font-weight: 300; margin-top: 5px; }

        /* الواجهة الرئيسية */
        header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #222; }
        .settings-btn { background: none; border: none; color: var(--gold); font-size: 1.5rem; cursor: pointer; }
        
        .main-card { background: var(--card); width: 90%; max-width: 380px; border-radius: 25px; padding: 30px; margin-top: 40px; border: 1px solid #222; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .timer-display { font-size: 3rem; color: var(--gold); font-family: monospace; margin: 20px 0; font-weight: bold; }
        
        .btn { width: 100%; padding: 18px; border-radius: 15px; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-in { background: var(--success); color: white; }
        .btn-out { background: var(--danger); color: white; }
        .btn-disabled { background: #333; color: #666; cursor: not-allowed; }

        /* الأرشيف والمودال */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; padding: 20px; }
        .modal-content { background: var(--card); border-radius: 20px; padding: 20px; max-height: 80vh; overflow-y: auto; border: 1px solid #333; }
        .history-item { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .history-date { color: #888; font-size: 0.8rem; }
        .history-hours { color: var(--gold); font-weight: bold; }

        #toast { position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 12px 30px; border-radius: 50px; font-weight: bold; transition: 0.5s; z-index: 10000; }
    </style>
</head>
<body>

    <div id="splashScreen">
        <div class="splash-logo">نظام الحضور</div>
        <div class="produced-by">Produced by</div>
        <div class="dev-name">[Ayman]</div>
    </div>

    <div id="toast">تم الإرسال والحفظ ✅</div>

    <header>
        <div style="width:30px"></div>
        <h2 style="color:var(--gold)">تسجيل العمل</h2>
        <button class="settings-btn" onclick="openArchive()">⚙️</button>
    </header>

    <div class="main-card">
        <div id="currentDate" style="color:#666; margin-bottom:10px"></div>
        <div class="timer-display" id="timer">00:00</div>
        <div id="statusText" style="margin-bottom:20px; color:#aaa">جاهز للبدء</div>
        
        <button id="btnIn" class="btn btn-in" onclick="startWork()">تسجيل حضور</button>
        <button id="btnOut" class="btn btn-out" onclick="endWork()" style="display:none">انصراف وحفظ</button>
    </div>

    <div id="archiveModal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--gold); margin-bottom:20px; text-align:center;">الأرشيف العام (دورة 26-25)</h3>
            <div id="historyList"></div>
            <button class="btn" style="background:#444; color:#fff;" onclick="closeArchive()">إغلاق</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8Bayque38t00AZ7dyuPOt_MTgY6LgpMNEgQUwB2YJa71YnpiNwC0lg3Uaom7_0pDk/exec";

        // شاشة البداية
        window.addEventListener('load', () => {
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('ar-EG', {weekday:'long', day:'numeric', month:'long'});
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 800);
            }, 2000);
            checkSession();
        });

        function checkSession() {
            const startTime = localStorage.getItem('work_start');
            if(startTime) {
                document.getElementById('btnIn').style.display = 'none';
                document.getElementById('btnOut').style.display = 'block';
                document.getElementById('statusText').innerText = "قيد العمل حالياً...";
                startTimerUpdate(new Date(startTime));
            }
        }

        function startWork() {
            const now = new Date();
            localStorage.setItem('work_start', now.toISOString());
            location.reload();
        }

        async function endWork() {
            const startTime = new Date(localStorage.getItem('work_start'));
            const endTime = new Date();
            
            const diffMs = endTime - startTime;
            const diffHrs = Math.floor(diffMs / 3600000);
            const diffMins = Math.round(((diffMs % 3600000) / 60000));
            const totalStr = `${diffHrs} س و ${diffMins} د`;

            // إرسال لجوجل شيت (عمودين فقط كما طلبت)
            const dateStr = endTime.toLocaleDateString('en-GB'); 
            const params = new URLSearchParams({ date: dateStr, totalHours: totalStr });

            try {
                showToast("جاري الحفظ...");
                await fetch(SCRIPT_URL + "?" + params.toString(), { method: 'POST' });
                
                // حفظ في الأرشيف المحلي
                saveToLocalArchive(dateStr, totalStr);
                
                localStorage.removeItem('work_start');
                showToast("تم الحفظ بنجاح ✅");
                setTimeout(() => location.reload(), 2000);
            } catch (e) {
                alert("مشكلة في الإرسال.. تأكد من الإنترنت");
            }
        }

        function saveToLocalArchive(date, hours) {
            let archive = JSON.parse(localStorage.getItem('user_archive') || '[]');
            archive.unshift({ date, hours, timestamp: new Date().toISOString() });
            localStorage.setItem('user_archive', JSON.stringify(archive));
        }

        function openArchive() {
            const list = document.getElementById('historyList');
            const archive = JSON.parse(localStorage.getItem('user_archive') || '[]');
            list.innerHTML = "";

            if(archive.length === 0) {
                list.innerHTML = "<p style='text-align:center; color:#666; padding:20px;'>السجل فارغ</p>";
            } else {
                // منطق دورة الشهر (من 26 لـ 25)
                archive.forEach(item => {
                    list.innerHTML += `
                        <div class="history-item">
                            <div class="history-date">${item.date}</div>
                            <div class="history-hours">${item.hours}</div>
                        </div>
                    `;
                });
            }
            document.getElementById('archiveModal').style.display = 'flex';
        }

        function closeArchive() { document.getElementById('archiveModal').style.display = 'none'; }

        function startTimerUpdate(start) {
            setInterval(() => {
                const diff = new Date() - start;
                const h = Math.floor(diff / 3600000).toString().padStart(2,'0');
                const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${h}:${m}`;
            }, 1000);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.bottom = "30px";
            setTimeout(() => t.style.bottom = "-60px", 3000);
        }
    </script>
</body>
</html>
